 const paths={arrow:'<path d="M4 12h16m-7-7 7 7-7 7"/>',chev:'<path d="m9 18 6-6-6-6"/>',search:'<circle cx="10.8" cy="10.8" r="7"/><path d="m16 16 5 5"/>',pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m18 0v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m4 12 5 5L20 6"/>',star:'<path d="m12 2 3.1 6.6 7.3.9-5.3 5.1 1.3 7.2-6.4-3.5-6.4 3.5 1.3-7.2-5.3-5.1 7.3-.9z"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m8 12 3 3 5-6"/>',leaf:'<path d="M20 4C7 4 4 9 4 15a5 5 0 0 0 5 5c6 0 11-3 11-16ZM4 20c5-6 9-9 15-12"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.7 8.8-8.7a5.5 5.5 0 0 0 0-7.8Z"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/>',mail:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="m2 7 10 7 10-7"/>',spark:'<path d="m12 2 2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2L12 2Z"/>',filter:'<path d="M4 7h16M7 12h10m-7 5h4"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
 return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.arrow}</svg>`;
};

function footer(){return `<footer class="footer"><div class="container"><div class="footer-main"><div class="footer-brand"><a href="${u('home')}" class="brand brand-light">${siteLogo()}</a><p>Journeys that stay with you long after you return. Beautiful places, meaningful moments, and a world worth exploring.</p><div class="footer-chip">✦ &nbsp; A WEBSITE PORTFOLIO CONCEPT</div></div><div class="footer-links"><h4>Explore</h4><a href="${u('destinations')}">Destinations</a><a href="${u('packages')}">All Journeys</a><a href="${u('package','id=bali-soul')}">Featured Escape</a><a href="${u('about')}">Our Philosophy</a></div><div class="footer-links"><h4>Discover</h4><a href="${u('destinations','region=Asia')}">Asia</a><a href="${u('destinations','region=Europe')}">Europe</a><a href="${u('packages','category=Adventure')}">Adventure</a><a href="${u('packages','category=Culture')}">Culture</a></div><div class="footer-links"><h4>Say hello</h4><p>This is a fictional travel brand created as a website design showcase.</p><a href="${u('contact')}">Explore the contact demo ${svg('arrow',14)}</a></div></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} VELORA Travel. Demonstration concept.</span><span>Designed for portfolio presentation by <strong>BisaBikinWeb Indonesia</strong></span><a href="#top" class="back-top">Back to top ↑</a></div></div></footer>`}
function sectionHead(eyebrow,title,desc='',extra=''){return `<div class="section-heading reveal"><div><span class="eyebrow">${eyebrow}</span><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${extra}</div>`}
function destCard(d,index=0,feature=false){return `<a class="destination-card ${feature?'destination-feature':''} reveal" href="${u('destination','id='+d.id)}" style="--delay:${Math.min(index,6)*70}ms"><img src="${img(d.image,feature?1200:700)}" loading="lazy" alt="Scenic view of ${d.name}, ${d.country}"/><span class="destination-shade"></span><span class="destination-index">0${index+1} / DISCOVER</span><span class="destination-info"><span class="destination-country">${d.country}</span><span class="destination-name">${d.name}</span><span class="destination-tag">${d.tag} ${svg('arrow',15)}</span></span><span class="round-icon">${svg('arrow',19)}</span></a>`}
function packageCard(p,index=0){let d=destinations.find(x=>x.id===p.destination); return `<article class="package-card reveal" style="--delay:${index*65}ms"><a href="${u('package','id='+p.id)}" class="package-media"><img src="${img(p.image,750)}" alt="${d.name} featured journey" loading="lazy"/><span class="package-badge">${p.badge}</span><span class="package-media-arrow">${svg('arrow',20)}</span></a><div class="package-body"><p class="package-location">${svg('pin',15)} ${d.name}, ${d.country} <span>•</span> ${p.days}</p><h3><a href="${u('package','id='+p.id)}">${p.name}</a></h3><p class="package-subtitle">${p.subtitle}</p><div class="package-bottom"><div><small>FROM / PERSON <span class="price-note">• DEMO PRICE</span></small><strong>${money(p.price)}</strong></div><a class="circle-arrow" aria-label="View ${p.name}" href="${u('package','id='+p.id)}">${svg('arrow',19)}</a></div></div></article>`}
function pageHero(eyebrow,heading,sub,imgId){return `<section class="inner-hero"><div class="inner-hero-photo" style="background-image:linear-gradient(90deg,rgba(8,29,26,.68),rgba(8,29,26,.08)),url('${img(imgId,1600)}')"></div><div class="container inner-hero-content"><span class="eyebrow eyebrow-light">${eyebrow}</span><h1>${heading}</h1><p>${sub}</p></div><div class="hero-trail">VELORA / THE WORLD IS WAITING</div></section>`}

function faq(){const questions=[['Is this a real travel booking website?','This website is a portfolio demonstration. Trips, prices and availability are illustrative. No real bookings or payments are accepted.'],['Can I explore the packages and destinations?','Absolutely. Browse destinations, filter journeys and preview the booking experience using sample information.'],['Are these prices and schedules confirmed?','No. The listed packages, itineraries, prices and dates are fictional concepts for presentation purposes.'],['Who created this website concept?','This travel interface was designed as a showcase of web design and frontend development capabilities for BisaBikinWeb Indonesia.']];return `<section class="section section-faq"><div class="container faq-layout"><div class="faq-side reveal"><span class="eyebrow">GOOD TO KNOW</span><h2>A little more<br/><em>about the journey.</em></h2><p>Curious about how this showcase works? Here are a few useful answers.</p><a class="text-link" href="${u('contact')}">Get in touch ${svg('arrow',18)}</a></div><div class="faq-items reveal">${questions.map((q,i)=>`<details class="faq-item" ${i===0?'open':''}><summary>${q[0]}<span class="faq-plus">${svg('plus',19)}</span></summary><p>${q[1]}</p></details>`).join('')}</div></div></section>`}

function home(){return `<main id="main"><section class="home-hero"><div class="hero-photo" style="background-image:linear-gradient(90deg,rgba(5,23,21,.66) 0%,rgba(5,23,21,.26) 56%,rgba(5,23,21,.17) 100%),url('${img(pics.hero,1900)}')"></div><div class="hero-texture"></div><div class="container hero-content"><span class="hero-kicker"><span class="kicker-line"></span> A NEW WAY TO WANDER</span><h1>The world is<br/>yours to <em>explore.</em></h1><p>Beautiful places. Unhurried moments. Extraordinary journeys made for the endlessly curious.</p><a class="hero-discover" href="${u('destinations')}"><span class="discover-play">${svg('arrow',22)}</span> Discover the world</a></div><div class="hero-vertical">CURATED ESCAPES • EXTRAORDINARY PLACES</div><div class="hero-bottom-note"><span>01 <span class="hero-rule"></span> 06</span><span>SCROLL TO EXPLORE ↓</span></div></section><div class="container search-overlap">${searchWidget()}</div><section class="intro-strip"><div class="container intro-strip-inner"><span>AN INVITATION TO</span><strong>Explore deeper. Feel more. Live fully.</strong><span class="intro-symbol">✳</span></div></section><section class="section destinations-section"><div class="container">${sectionHead('01 / THE PLACES','Destinations worth<br/><em>dreaming about.</em>','From hidden corners to iconic landscapes. Find somewhere that stays with you.',`<a href="${u('destinations')}" class="text-link">View all destinations ${svg('arrow',18)}</a>`)}<div class="destinations-grid">${destCard(destinations[0],0,true)}${destCard(destinations[1],1)}${destCard(destinations[2],2)}</div><div class="destination-footer"><p>A world of extraordinary places is waiting.</p><a class="text-link" href="${u('destinations')}">Discover 6 destinations ${svg('arrow',18)}</a></div></div></section><section class="section journey-section"><div class="container">${sectionHead('02 / THE EXPERIENCES','Not just trips.<br/><em>Stories to tell.</em>','Thoughtfully imagined escapes for different moods, moments and people.',`<a href="${u('packages')}" class="text-link">Explore all journeys ${svg('arrow',18)}</a>`)}<div class="packages-grid">${packages.slice(0,3).map(packageCard).join('')}</div></div></section><section class="story-section"><div class="story-media"><img src="${img(pics.story,1200)}" loading="lazy" alt="Calm mountain lake surrounded by wilderness"/><span class="story-media-label">A MOMENT TO REMEMBER · 01/24</span></div><div class="story-copy"><span class="eyebrow">03 / THE VELORA PHILOSOPHY</span><h2>The best moments<br/>aren't things.<br/><em>They're feelings.</em></h2><p>We believe a journey should make you feel something. The golden light before sunset. The first sip of coffee in a new city. The joy of taking the long way home.</p><p>VELORA is a travel concept built around meaningful experiences, thoughtful details and places that make you pause.</p><a class="btn btn-dark" href="${u('about')}">Read our story ${svg('arrow',18)}</a><div class="story-stamp">GO FAR<br/>FEEL MORE<br/>✳</div></div></section><section class="experience-section section"><div class="container">${sectionHead('04 / FOLLOW YOUR CURIOSITY','Every traveler has<br/><em>their own story.</em>','Whatever moves you, there is a journey worth taking.')}<div class="experience-grid">${[{name:'The great outdoors',sub:'ADVENTURE & NATURE',pic:pics.adventure,category:'Adventure'},{name:'Culture in every corner',sub:'CULTURE & HERITAGE',pic:pics.culture,category:'Culture'},{name:'A slower kind of escape',sub:'OCEAN & RELAXATION',pic:pics.beach,category:'Beach'}].map(x=>`<a class="experience-card reveal" href="${u('packages','category='+x.category)}"><img src="${img(x.pic,850)}" alt="${x.name}" loading="lazy"/><span class="experience-shade"></span><span class="experience-sub">${x.sub}</span><span class="experience-title">${x.name}${svg('arrow',18)}</span></a>`).join('')}</div></div></section><section class="how-section section"><div class="container"><div class="how-heading reveal"><span class="eyebrow">05 / GOOD THINGS TAKE SHAPE</span><h2>Your next adventure,<br/><em>beautifully simple.</em></h2></div><div class="steps-grid">${[{n:'01',title:'Find your feeling',desc:'Browse destinations and discover the experiences that speak to you.',icon:'compass'},{n:'02',title:'Make it yours',desc:'Explore the details, itinerary and thoughtful touches behind every trip.',icon:'leaf'},{n:'03',title:'Imagine what’s next',desc:'Preview how a seamless booking journey could feel, from start to finish.',icon:'heart'}].map(x=>`<article class="step reveal"><div class="step-icon">${svg(x.icon,30)}</div><span class="step-num">${x.n} / THE PROCESS</span><h3>${x.title}</h3><p>${x.desc}</p></article>`).join('')}</div><p class="how-disclaimer">VELORA is a fictional brand created for a design portfolio. No actual travel services are offered.</p></div></section>${faq()}${closingCTA()}</main>`}
function destinationsPage(){const qs=params.get('search')||''; return `<main>${pageHero('THE WORLD IS WAITING','Where to <em>next?</em>','Six remarkable places. Endless reasons to explore.',pics.journey)}<section class="section listing-section"><div class="container">${sectionHead('01 / EXPLORE BY DESTINATION','A place for every<br/><em>kind of dream.</em>','From coastal hideaways to mountain air. Your next favorite place could be right here.')}<div class="filter-bar"><div class="filter-buttons" id="destinationFilters"><button data-filter="All" class="active">All destinations</button><button data-filter="Asia">Asia</button><button data-filter="Europe">Europe</button></div><label class="filter-search">${svg('search',18)}<input id="destinationSearch" type="search" placeholder="Search a place..." value="${escapeAttr(qs)}"/></label></div><div class="all-destinations-grid" id="destinationList">${destinations.map((d,i)=>destCard(d,i)).join('')}</div><p class="empty-result" hidden id="destinationEmpty">No destinations match that search. Try another place.</p></div></section>${closingCTA()}</main>`}
function packagesPage(){const active=params.get('category')||'All';return `<main>${pageHero('CURATED JOURNEYS','For the love of<br/><em>going places.</em>','Every great story begins with the decision to go.',pics.nature)}<section class="section listing-section"><div class="container">${sectionHead('02 / OUR SIGNATURE JOURNEYS','Find the journey<br/><em>that feels like you.</em>','Six illustrative travel experiences, designed to showcase the possibilities of a modern travel website.')}<div class="filter-bar"><div class="filter-buttons" id="packageFilters">${['All','Beach','Culture','Adventure','Romance'].map(c=>`<button data-filter="${c}" class="${c===active?'active':''}">${c==='All'?'All journeys':c}</button>`).join('')}</div><span class="filter-count" id="packageCount">6 journeys</span></div><div class="packages-grid all-packages" id="packagesList">${packages.map(packageCard).join('')}</div><div class="demo-note">${svg('spark',19)} All packages and prices are illustrative portfolio content, not real offers.</div></div></section>${faq()}${closingCTA()}</main>`}
function destinationPage(){const d=destinations.find(x=>x.id===params.get('id'))||destinations[0]; const related=packages.filter(p=>p.destination===d.id);return `<main>${pageHero(`${d.eyebrow} / ${d.country}`,`${d.name}<em>.</em>`,d.title,d.image)}<section class="section detail-intro"><div class="container detail-grid"><div class="detail-copy reveal"><span class="eyebrow">THE PLACE / ${d.country.toUpperCase()}</span><h2>Beautifully different.<br/><em>Entirely unforgettable.</em></h2><p>${d.description}</p><p>Allow yourself to get lost in the little details. The textures, flavors, conversations and quiet surprises that make each journey one of a kind.</p><a href="${u('packages')}" class="btn btn-dark">See all experiences ${svg('arrow',17)}</a></div><aside class="facts-card reveal"><span class="eyebrow">THE ESSENTIALS</span><div class="fact-row"><span>DESTINATION</span><strong>${d.name}</strong></div><div class="fact-row"><span>COUNTRY</span><strong>${d.country}</strong></div><div class="fact-row"><span>RECOMMENDED STAY</span><strong>${d.nights}</strong></div><div class="fact-row"><span>BEST FOR</span><strong>${d.highlight}</strong></div><div class="fact-ornament">✳</div></aside></div></section><section class="section detail-gallery"><div class="container"><div class="detail-gallery-top">${sectionHead('EXPLORE THE FEELING','A glimpse of <em>${d.name}.</em>')}</div><div class="gallery-feature"><img src="${img(d.image,1300)}" alt="${d.name} landscape"/><div><img src="${img(pics.nature,700)}" alt="Nature landscape"/><img src="${img(pics.coastal,700)}" alt="Travel architectural scenery"/></div></div></div></section><section class="section journey-section"><div class="container">${sectionHead('MADE FOR THIS DESTINATION','Take the longer <em>way around.</em>') }<div class="packages-grid">${(related.length?related:packages.slice(0,3)).map(packageCard).join('')}</div></div></section>${closingCTA()}</main>`}
function packagePage(){const p=packages.find(x=>x.id===params.get('id'))||packages[0],d=destinations.find(x=>x.id===p.destination);return `<main><section class="package-detail-hero"><div class="package-detail-image" style="background-image:linear-gradient(0deg,rgba(7,26,24,.68),rgba(7,26,24,.12)),url('${img(p.image,1800)}')"></div><div class="container package-detail-title"><span class="eyebrow eyebrow-light">${d.country.toUpperCase()} / SIGNATURE JOURNEY</span><h1>${p.name}</h1><p>${p.subtitle}</p><div class="detail-tags"><span>${svg('clock',16)} ${p.days}</span><span>${svg('pin',16)} ${d.name}, ${d.country}</span><span>${svg('spark',16)} PORTFOLIO CONCEPT</span></div></div></section><div class="container"><div class="detail-breadcrumb"><a href="${u('home')}">Home</a> ${svg('chev',14)} <a href="${u('packages')}">Journeys</a> ${svg('chev',14)} <span>${p.name}</span></div><div class="package-detail-layout"><div><section class="package-overview"><span class="eyebrow">THE EXPERIENCE</span><h2>For the moments<br/><em>you'll remember.</em></h2><p>${p.subtitle} Journey through some of ${d.name}'s most memorable settings with a well-paced itinerary that balances discovery and time for yourself.</p><p>Every detail is thoughtfully imagined for this portfolio concept, from scenic stays to meaningful local moments.</p><div class="feature-pills">${p.features.map(f=>`<span>${svg('check',15)} ${f}</span>`).join('')}</div></section><section class="package-itinerary"><span class="eyebrow">DAY BY DAY</span><h2>The journey <em>unfolds.</em></h2><div class="itinerary-items">${p.itinerary.map((i,k)=>`<details class="itinerary-item" ${k===0?'open':''}><summary><span class="itinerary-num">${String(k+1).padStart(2,'0')}</span><span><small>${i[0]}</small><strong>${i[1]}</strong></span><span class="itinerary-toggle">${svg('plus',19)}</span></summary><p>${i[2]}</p></details>`).join('')}</div></section><section class="section includes-section"><span class="eyebrow">GOOD TO KNOW</span><h2>Thoughtful <em>details.</em></h2><div class="includes-grid"><div><h3>What's imagined in this trip</h3><ul>${p.features.map(f=>`<li>${svg('check',16)} ${f}</li>`).join('')}<li>${svg('check',16)} Curated sample itinerary</li></ul></div><div><h3>Important to remember</h3><ul><li>${svg('spark',16)} This journey is fictional</li><li>${svg('spark',16)} Availability is not real-time</li><li>${svg('spark',16)} No booking or payment is processed</li></ul></div></div></section></div><aside class="booking-aside"><div class="booking-box"><span class="booking-top-label">YOUR JOURNEY BEGINS HERE</span><div class="booking-price"><small>FROM / PERSON · DEMO PRICE</small><strong>${money(p.price)}</strong>${p.old?`<del>${money(p.old)}</del>`:''}</div><div class="booking-form"><label>Choose a travel date<input type="date" id="bookDate"/></label><label>Travelers<select id="bookGuests"><option value="1">1 traveler</option><option value="2" selected>2 travelers</option><option value="3">3 travelers</option><option value="4">4 travelers</option></select></label></div><div class="booking-total"><span>Illustrative total</span><strong id="bookingTotal">${money(p.price*2)}</strong></div><button class="btn btn-dark book-button" id="previewBooking" data-package="${p.id}">Preview booking ${svg('arrow',18)}</button><p class="booking-disclaimer">${svg('shield',16)} Portfolio demo only. No actual reservation or payment.</p></div><div class="booking-help">${svg('heart',20)}<div><strong>Not sure where to start?</strong><p>Explore this design concept and all the journeys.</p><a href="${u('contact')}">View contact demo ${svg('arrow',15)}</a></div></div></aside></div></div>${closingCTA()}</main>`}
function aboutPage(){return `<main>${pageHero('THE STORY BEHIND THE JOURNEY','Go far.<br/><em>Feel more.</em>','An imaginary travel studio with a very real love for good design.',pics.story)}<section class="section about-intro"><div class="container about-grid"><div class="about-lead reveal"><span class="eyebrow">HELLO, WE'RE VELORA</span><h2>Travel is more<br/>than a place.<br/><em>It's a feeling.</em></h2></div><div class="about-description reveal"><p class="large">A little curiosity can change everything.</p><p>VELORA was imagined for explorers, daydreamers, nature lovers and anyone who believes there is still so much beauty left to discover.</p><p>This fictional brand is part of a portfolio experience that celebrates the intersection of thoughtful design, engaging storytelling and modern travel interfaces.</p><p>No trips are sold here. The focus is the experience of exploring the site itself.</p></div></div></section><div class="about-wide-image"><img src="${img(pics.coastal,1600)}" loading="lazy" alt="Coastal travel scenery"/><span>MADE TO INSPIRE. DESIGNED TO EXPLORE.</span></div><section class="section about-values"><div class="container">${sectionHead('WHAT DRIVES US','The little things<br/><em>matter most.</em>')}<div class="values-grid"><article>${svg('compass',34)}<h3>Curiosity always</h3><p>Celebrate places that invite us to ask questions and look a little closer.</p></article><article>${svg('leaf',34)}<h3>Intentional moments</h3><p>Make room for beauty in the in-between, not just the postcard moments.</p></article><article>${svg('heart',34)}<h3>Thoughtful by design</h3><p>Build a digital journey that feels as inspiring as the travel it represents.</p></article></div></div></section>${closingCTA()}</main>`}
function contactPage(){return `<main>${pageHero('GET IN TOUCH / PORTFOLIO DEMO',"Let's make room<br/><em>for wonder.</em>",'Explore the look and feel of a premium travel inquiry experience.',pics.beach)}<section class="section contact-section"><div class="container contact-layout"><div class="contact-copy reveal"><span class="eyebrow">DROP US A NOTE</span><h2>Every journey starts<br/><em>somewhere.</em></h2><p>This is a sample contact page created to showcase a travel agency website. Messages aren't sent to any company.</p><div class="contact-meta"><div>${svg('mail',23)}<span><small>DEMO CONTACT</small><strong>hello@velora.example</strong></span></div><div>${svg('pin',23)}<span><small>INSPIRED BY</small><strong>Beautiful places, everywhere</strong></span></div><div>${svg('globe',23)}<span><small>THIS PROJECT</small><strong>BisaBikinWeb Indonesia portfolio concept</strong></span></div></div></div><div class="contact-form-shell reveal"><div class="form-head"><span class="eyebrow">LET'S CONNECT</span><h3>Tell us about your dream escape.</h3><p>Form preview only. No personal data is transmitted or stored.</p></div><form id="contactDemoForm" class="contact-demo-form"><div class="form-pair"><label>Your name<input type="text" placeholder="Your name" required minlength="2"/></label><label>Email address<input type="email" placeholder="you@example.com" required/></label></div><label>Dream destination<select required><option value="" selected disabled>Where would you love to go?</option>${destinations.map(d=>`<option>${d.name}, ${d.country}</option>`).join('')}</select></label><label>What's on your mind?<textarea rows="4" placeholder="Tell us about your dream trip..." required></textarea></label><button class="btn btn-dark" type="submit">Preview submission ${svg('arrow',17)}</button><p class="form-disclaimer">Demo only: clicking submit shows a preview confirmation, not an actual message delivery.</p></form></div></div></section>${faq()}</main>`}
const routeMap={home,destinations:destinationsPage,destination:destinationPage,packages:packagesPage,package:packagePage,about:aboutPage,contact:contactPage};
const pageLabels={home:'Curated Journeys, Extraordinary Places',destinations:'Explore Destinations',destination:'Destination Stories',packages:'Signature Journeys',package:'Journey Details',about:'Our Story',contact:'Get in Touch'};
document.title = (pageLabels[route]||'Travel Studio')+' | VELORA Travel';
document.body.classList.add('route-'+route);
elm.innerHTML=`<div id="top"></div>${header()}${(routeMap[route]||home)()}${footer()}<div class="toast" id="demoToast" role="status" aria-live="polite"></div><dialog class="booking-dialog" id="bookingDialog"><div class="modal-head"><span class="eyebrow">SIMULATED BOOKING EXPERIENCE</span><button class="modal-close" aria-label="Close dialog" id="closeDialog">${svg('close',21)}</button></div><div id="dialogBody"></div></dialog>`;
document.querySelectorAll('img').forEach(el=>el.addEventListener('error',()=>el.classList.add('failed')));
const siteHeader=document.getElementById('siteHeader');
const scrollCheck=()=>siteHeader.classList.toggle('scrolled',window.scrollY>38);
window.addEventListener('scroll',scrollCheck,{passive:true});scrollCheck();
const toggle=document.getElementById('menuToggle'),nav=document.getElementById('mainNav');
toggle.addEventListener('click',()=>{let v=nav.classList.toggle('open');toggle.innerHTML=svg(v?'close':'menu',25);toggle.setAttribute('aria-expanded',String(v));document.body.classList.toggle('nav-open',v);});
nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');document.body.classList.remove('nav-open');}));
const observer = 'IntersectionObserver' in window? new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');observer.unobserve(e.target)}}),{threshold:.085}):null;
document.querySelectorAll('.reveal').forEach(el=>observer?observer.observe(el):el.classList.add('is-visible'));
function toast(txt){const t=document.getElementById('demoToast');t.textContent=txt;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),4200)}
const heroSearch=document.getElementById('heroSearch');if(heroSearch){heroSearch.addEventListener('submit',ev=>{ev.preventDefault();const id=document.getElementById('destSelect').value;const date=document.getElementById('travelDate').value;if(id){location.href=u('destination','id='+encodeURIComponent(id)+(date?'&date='+encodeURIComponent(date):''));}else{location.href=u('destinations');}});}
function destFilter(){const buttons=[...document.querySelectorAll('#destinationFilters button')],search=document.getElementById('destinationSearch'),items=[...document.querySelectorAll('#destinationList .destination-card')];if(!search)return;let initial=params.get('region')||'All';function apply(){let active=buttons.find(b=>b.classList.contains('active'))?.dataset.filter||'All';let query=search.value.toLowerCase().trim();let shown=0;items.forEach((el,i)=>{let d=destinations[i],keep=(active==='All'||d.region===active)&&(!query||`${d.name} ${d.country} ${d.tag}`.toLowerCase().includes(query));el.hidden=!keep;if(keep)shown++;});document.getElementById('destinationEmpty').hidden=shown>0;}buttons.forEach(b=>{b.classList.toggle('active',b.dataset.filter===initial);b.addEventListener('click',()=>{buttons.forEach(x=>x.classList.toggle('active',x===b));apply();});});if(!buttons.some(b=>b.classList.contains('active')))buttons[0].classList.add('active');search.addEventListener('input',apply);apply();}destFilter();
function pkgFilter(){const group=document.getElementById('packageFilters');if(!group)return;const buttons=[...group.querySelectorAll('button')],cards=[...document.querySelectorAll('#packagesList .package-card')];function apply(){let filter=buttons.find(b=>b.classList.contains('active'))?.dataset.filter||'All';let count=0;cards.forEach((card,i)=>{let shown=filter==='All'||packages[i].category===filter;card.hidden=!shown;if(shown)count++;});document.getElementById('packageCount').textContent=count+' '+(count===1?'journey':'journeys');}buttons.forEach(b=>b.addEventListener('click',()=>{buttons.forEach(x=>x.classList.toggle('active',x===b));apply();}));apply();}pkgFilter();
let bookingDate=document.getElementById('bookDate'),guests=document.getElementById('bookGuests');
if(bookingDate){const soon=new Date();soon.setDate(soon.getDate()+1);const future=`${soon.getFullYear()}-${String(soon.getMonth()+1).padStart(2,'0')}-${String(soon.getDate()).padStart(2,'0')}`;bookingDate.min=future;bookingDate.value=(params.get('date')||future);const p=packages.find(x=>x.id===params.get('id'))||packages[0];guests.addEventListener('change',()=>document.getElementById('bookingTotal').textContent=money(p.price*Number(guests.value)));document.getElementById('previewBooking').addEventListener('click',()=>{if(!bookingDate.value||bookingDate.value<future){toast('Please choose a future travel date.');bookingDate.focus();return;}const dialog=document.getElementById('bookingDialog');document.getElementById('dialogBody').innerHTML=`<div class="dialog-icon">${svg('spark',33)}</div><h2>A little preview<br/><em>of your next escape.</em></h2><p>This is what a booking summary could look like for <strong>${p.name}</strong>.</p><div class="dialog-summary"><div><span>TRAVEL DATE</span><strong>${escapeHTML(bookingDate.value)}</strong></div><div><span>GUESTS</span><strong>${guests.value} traveler(s)</strong></div><div><span>ILLUSTRATIVE TOTAL</span><strong>${money(p.price*Number(guests.value))}</strong></div></div><div class="dialog-notice">${svg('shield',19)} This is a website portfolio demo. No booking was created and no payment is collected.</div><button class="btn btn-dark" id="dialogDone">Keep exploring ${svg('arrow',18)}</button>`;dialog.showModal();document.getElementById('dialogDone').addEventListener('click',()=>dialog.close());});}
document.getElementById('closeDialog').addEventListener('click',()=>document.getElementById('bookingDialog').close());document.getElementById('bookingDialog').addEventListener('click',ev=>{if(ev.target.tagName==='DIALOG')ev.target.close()});
const contactForm=document.getElementById('contactDemoForm');if(contactForm){contactForm.addEventListener('submit',ev=>{ev.preventDefault();toast('Demo complete: form validated locally. No information was sent or saved.');contactForm.reset();});}
function escapeHTML(str){return String(str).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function escapeAttr(s){return escapeHTML(s)}
})();
</script></body></html>
