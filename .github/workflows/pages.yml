name: Deploy GitHub Pages
on:
  # Frequent content commits were repeatedly replacing the pending deploy run.
  # Deploy immediately when this workflow or legal policy changes, otherwise on a timed cadence.
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'static-source/lib/legal-policies.ts'
      # Showcase/shop changes deploy immediately without waiting for the 15-minute content batch.
      - 'static-source/features/WebsiteLiveDemo.tsx'
      - 'static-source/features/WebsiteStore.tsx'
      - 'static-source/components/DokuPaymentChannels.tsx'
      - 'static-source/components/FooterPaymentMethods.tsx'
      - 'static-source/styles.css'
      - 'static-source/reference-navigation.css'
      - 'tests/header-layout.test.mjs'
      - 'static-source/features/Commerce.tsx'
      - 'static-source/features/PaymentGatewayAdmin.tsx'
      - 'tests/website-doku.test.mjs'
      - 'static-source/features/website-live-demo.css'
      - 'static-source/features/website-store.css'
      - 'static-source/features/Studio.tsx'
      - 'static-source/features/EcommerceShowcase.tsx'
      - 'static-source/features/ecommerce-showcase.css'
      - 'static-source/components/Visuals.tsx'
      - 'tests/ecommerce-preview.test.mjs'
      - 'public-assets/portfolio/mejavi-home-desktop.png'
      - 'public-assets/portfolio/mejavi-home-mobile.png'
      - 'public-assets/portfolio/mejavi-home-desktop.mp4'
      - 'public-assets/portfolio/mejavi-home-mobile.mp4'
      - 'static-source/lib/demo-creative.mjs'
      - 'static-source/lib/demo-industries.mjs'
      - 'static-source/lib/website-demos.mjs'
      - 'static-source/lib/website-store.ts'
      - 'tests/website-demos-60.test.mjs'
      - 'static-source/features/WebsiteStore.tsx'
      - 'static-source/features/website-store.css'
      - 'static-source/features/WebsiteLiveDemo.tsx'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Let an active publication finish when content jobs push several commits close together.
  # GitHub keeps at most one pending run in this group; the latest push wins.
  group: production-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Security checks and build
        run: npm test && npm run build && npm run test:output
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          # Larger static site may stay in syncing_files beyond the default 10 minutes.
          timeout: "1200000"
