name: Import editorial cover binaries

on:
  push:
    paths:
      - 'tmp/editorial-covers/*.webp.b64'

permissions:
  contents: write

concurrency:
  group: editorial-cover-binary-import
  cancel-in-progress: false

jobs:
  import:
    if: github.event.head_commit.message != 'media: import editorial cover binaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and validate WebP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-assets/editorial-covers
          shopt -s nullglob
          files=(tmp/editorial-covers/*.webp.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No staged cover binaries."
            exit 0
          fi
          for encoded in "${files[@]}"; do
            target="public-assets/editorial-covers/$(basename "$encoded" .b64)"
            base64 --decode "$encoded" > "$target"
            file "$target" | grep -qi 'web/p image'
            rm "$encoded"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-assets/editorial-covers tmp/editorial-covers
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
            exit 0
          fi
          git commit -m "media: import editorial cover binaries"
          git push
