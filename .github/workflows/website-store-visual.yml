name: Website Store Industry Visual QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'static-source/features/WebsiteStore.tsx'
      - 'static-source/features/WebsiteLiveDemo.tsx'
      - 'static-source/components/IndustrySitePreview.tsx'
      - 'static-source/components/industry-site-preview.css'
      - 'scripts/verify-industry-preview.mjs'
      - '.github/workflows/website-store-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  industry-visual-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full website regression tests
        run: npm test
      - name: Build offline site
        run: BBWEB_OFFLINE_BUILD=1 npm run build
      - name: Verify generated production HTML
        run: npm run test:output
      - name: Start local preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site-dist > /tmp/preview-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:4173/beli-website/
      - name: Capture and test distinct Company Profile vs E-Commerce previews
        run: node scripts/verify-industry-preview.mjs
      - name: Upload screenshots (desktop and mobile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industry-preview-screenshots
          path: industry-preview-report/
          if-no-files-found: warn
          retention-days: 30
