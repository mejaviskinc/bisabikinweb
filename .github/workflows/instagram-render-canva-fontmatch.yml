name: Render Canva Font-Matched Quote Feed Assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-render-canva-fontmatch.yml'
      - 'scripts/instagram_render_canva_fontmatched.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: canva-fontmatch-bisabikinweb
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter
          python3 -m pip install --no-cache-dir Pillow==12.0.0
          fc-match 'Inter Display:style=Bold'
      - name: Generate 100 original-Canva-layout quotes with matched font
        run: python3 scripts/instagram_render_canva_fontmatched.py
      - name: Validate 100 images
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          roots=[
            Path('social/instagram/rendered/fontmatched-2026-11-04-to-12'),
            Path('social/instagram/rendered/fontmatched-2026-11-04-motivasi')
          ]
          expected=(90,10)
          for root,n in zip(roots,expected):
            jpgs=list(root.glob('[0-9][0-9][0-9].jpg'))
            assert len(jpgs)==n,(root,len(jpgs))
            for p in jpgs:
              with Image.open(p) as img:
                assert img.format=='JPEG' and img.size==(1080,1350),str(p)
          print('100_QUOTES_FONT_MATCHED_ASSETS_VALIDATED')
          PY
      - name: Save assets in repository without publishing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social/instagram/rendered/fontmatched-2026-11-04-to-12/ social/instagram/rendered/fontmatched-2026-11-04-motivasi/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets(instagram): font-match 100 quotes with original Canva typography'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'FONT_MATCH_100_ASSETS_READY_NOT_PUBLISHED'
