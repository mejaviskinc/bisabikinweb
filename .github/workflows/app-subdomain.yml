name: App subdomain build checks
on:
  push:
    branches: [main, feature/app-subdomain-portal]
    paths:
      - 'scripts/build-app.mjs'
      - 'tests/app-subdomain.test.mjs'
      - 'subdomains/app/**'
      - 'netlify.app.toml'
      - 'static-source/**'
      - 'build-pages.mjs'
      - 'vite.pages.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-subdomain.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-app-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build app portal
        run: npm test && npm run build:app
      - name: Check isolated artifact
        run: |
          test -f app-dist/index.html
          test -f app-dist/admin/index.html
          test -f app-dist/seller/index.html
          test -f app-dist/_headers
          test -f app-dist/_redirects
          test -d app-dist/assets
          test ! -f app-dist/CNAME
          test ! -d app-dist/artikel
          test ! -d app-dist/checkout
          test ! -f app-dist/sitemap.xml
      - name: Save deploy-ready app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bisabikinweb-app-deploy
          path: app-dist/
          if-no-files-found: error
          retention-days: 7
