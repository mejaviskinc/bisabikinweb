# Scheduled publication workflow. It only runs the publish job when IG_AUTOPUBLISH_ENABLED=true.
# The GitHub queue must contain an approved licensed JPEG for the requested date/slot.
name: Instagram BisaBikinWeb Auto Publish
on:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Asia/Jakarta'
    - cron: '30 10 * * *'
      timezone: 'Asia/Jakarta'
    - cron: '30 12 * * *'
      timezone: 'Asia/Jakarta'
    - cron: '30 16 * * *'
      timezone: 'Asia/Jakarta'
    - cron: '30 18 * * *'
      timezone: 'Asia/Jakarta'
  workflow_dispatch:
    inputs:
      slot:
        description: WIB posting slot
        type: choice
        required: true
        options: ['09:00', '10:30', '12:30', '16:30', '18:30']
permissions:
  contents: write
concurrency:
  group: bisabikinweb-instagram-publish
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ vars.IG_AUTOPUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IG_AUTOPUBLISH_ENABLED: ${{ vars.IG_AUTOPUBLISH_ENABLED }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve WIB slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          case "$EVENT_NAME:$EVENT_SCHEDULE" in
            schedule:'0 9 * * *') SLOT='09:00' ;;
            schedule:'30 10 * * *') SLOT='10:30' ;;
            schedule:'30 12 * * *') SLOT='12:30' ;;
            schedule:'30 16 * * *') SLOT='16:30' ;;
            schedule:'30 18 * * *') SLOT='18:30' ;;
            workflow_dispatch:*) SLOT="$MANUAL_SLOT" ;;
            *) echo 'Unsupported schedule'; exit 1 ;;
          esac
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
      - name: Publish one approved item
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
        run: python3 scripts/instagram_autopost.py --publish --slot "$SLOT"
