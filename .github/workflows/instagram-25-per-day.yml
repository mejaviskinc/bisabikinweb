# Replace the legacy 25-quote batch with an editorial selection gate.
# Keep original Meta Graph API publishing, state file, secrets and concurrency.
name: Instagram BisaBikinWeb Editorial AutoPost
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-25-per-day.yml'
      - 'scripts/instagram_editorial.py'
      - 'social/instagram/editorial/content.json'
      - 'scripts/instagram_prepare.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/instagram-25-per-day.yml'
      - 'scripts/instagram_editorial.py'
      - 'social/instagram/editorial/content.json'
      - 'tests/test_instagram_editorial.py'
permissions:
  contents: write
concurrency:
  group: bisabikinweb-instagram-publish
  cancel-in-progress: false

jobs:
  quality_gate:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate editorial queue without secrets or publishing
        run: python3 scripts/instagram_editorial.py --validate-only
      - name: Test editorial and original publishing safety
        run: python3 -m unittest discover -s tests -p 'test_instagram_editorial.py' -v
      - name: Render available editorial image previews offline
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.0.0
          python3 scripts/instagram_editorial.py --render-preview
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          expected=len(json.loads(Path('social/instagram/editorial/content.json').read_text(encoding='utf8'))['items'])
          files=list(Path('social/instagram/.runtime/editorial-preview').glob('*.jpg'))
          assert len(files)==expected, f'Expected {expected} images, found {len(files)}'
          for path in files:
              with Image.open(path) as pic:
                  assert pic.size==(1080,1350) and pic.format=='JPEG', str(path)
          print(f'EDITORIAL_PREVIEW_QA_OK: {expected} owned JPEGs 1080x1350')
          PY
      - name: Save visual previews for review
        uses: actions/upload-artifact@v4
        with:
          name: bisabikinweb-instagram-mixed-preview
          path: social/instagram/.runtime/editorial-preview/*.jpg
          retention-days: 7
          if-no-files-found: ignore
  publish:
    if: ${{ false }} # TEMPORARY DESIGN HOLD: previews rejected; do not publish until approved
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current reviewed editorial queue
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select one due editorial item or validate read-only
        id: select
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python3 scripts/instagram_editorial.py --select
          else
            python3 scripts/instagram_editorial.py --validate-only
          fi
      - name: Check rolling Meta publishing quota before claiming a post
        id: quota
        if: ${{ github.event_name == 'schedule' && steps.select.outputs.ready == 'true' }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.instagram_autopost import meta, SafeStop

          token=os.environ.get("IG_ACCESS_TOKEN","")
          user_id=os.environ.get("IG_USER_ID","")
          if not token or not user_id.isdigit():
              raise SystemExit("QUOTA_SAFE_STOP: Instagram credentials unavailable")
          try:
              response=meta("GET",user_id+"/content_publishing_limit",token,
                            {"fields":"quota_usage,config"},stage="CHECK_PUBLISH_QUOTA")
          except SafeStop as e:
              raise SystemExit("QUOTA_SAFE_STOP: "+str(e))
          obj=response.get("data")
          entry=obj[0] if isinstance(obj,list) and obj else response
          if not isinstance(entry,dict):
              raise SystemExit("QUOTA_SAFE_STOP: unsupported Meta quota response")
          try:
              usage=int(entry["quota_usage"])
          except (KeyError,ValueError,TypeError):
              raise SystemExit("QUOTA_SAFE_STOP: no quota usage in Meta response")
          cfg=entry.get("config") if isinstance(entry.get("config"),dict) else {}
          try:
              total=int(cfg["quota_total"])
          except (KeyError,ValueError,TypeError):
              total=25 # Conservative legacy ceiling when Meta omits configuration
          if total <= 0 or usage < 0:
              raise SystemExit("QUOTA_SAFE_STOP: invalid quota numbers")
          allowed=usage < total
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf8") as output:
              output.write("allowed="+str(allowed).lower()+"\n")
          print("META_PUBLISH_QUOTA: used="+str(usage)+", total="+str(total)+", allowed="+str(allowed))
          PY
      - name: Render and verify original editorial JPEG
        id: prepare
        if: ${{ github.event_name == 'schedule' && steps.select.outputs.ready == 'true' && steps.quota.outputs.allowed == 'true' }}
        env:
          DATE: ${{ steps.select.outputs.date }}
          SLOT: ${{ steps.select.outputs.slot }}
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.0.0
          python3 scripts/instagram_editorial.py --prepare --date "$DATE" --slot "$SLOT"
      - name: Publish exactly one approved editorial card through Meta Graph API
        if: ${{ github.event_name == 'schedule' && steps.prepare.outputs.ready == 'true' }}
        env:
          DATE: ${{ steps.select.outputs.date }}
          SLOT: ${{ steps.select.outputs.slot }}
          PREPARED_QUEUE: ${{ steps.prepare.outputs.queue }}
        run: |
          python3 scripts/instagram_autopost.py --publish --date "$DATE" --slot "$SLOT" --queue "$PREPARED_QUEUE"
      - name: Explain quota-limited skip
        if: ${{ github.event_name == 'schedule' && steps.select.outputs.ready == 'true' && steps.quota.outputs.allowed == 'false' }}
        run: |
          echo "SKIP: Meta rolling 24-hour publishing quota reached; no duplicate claim made"


  # Recovery route for the separate, owner-approved 200-quotes and 60-carousel
  # queues. The rejected six editorial drafts remain deleted and publish HOLD
  # above is deliberately unchanged. Primary schedulers remain intact.
  fallback_quotes200:
    if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && vars.IG_AUTOPUBLISH_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: One due approved quote only, honoring Meta quota and anti-duplicate state
        run: python3 scripts/instagram_publish_200_every20.py

  fallback_carousel60:
    needs: fallback_quotes200
    if: ${{ always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && vars.IG_AUTOPUBLISH_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare original carousel artwork dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.0.0
      - name: One approved original carousel only, honoring 55-minute gap and Meta quota
        run: python3 scripts/instagram_carousel60_publish_one.py
