name: Instagram BisaBikinWeb 25 Quotes Daily
on:
  schedule:
    - cron: '7,27,47 0-16 10-13 11 *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-25-per-day.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bisabikinweb-instagram-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/instagram_schedule_25.py --validate-only
