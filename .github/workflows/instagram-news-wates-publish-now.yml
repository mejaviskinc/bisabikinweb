name: Instagram BisaBikinWeb Verified First News Carousel NOW
on:
  push:
    branches: [main]
    paths:
      - 'social/instagram/news-carousels/commands/publish-manahan-wates-now-20261111.json'
permissions:
  contents: write
concurrency:
  group: bisabikinweb-instagram-publish
  cancel-in-progress: false
jobs:
  publish_news_carousel:
    if: ${{ github.ref == 'refs/heads/main' && vars.IG_AUTOPUBLISH_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install original brand typeface and image renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter librsvg2-bin
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.0.0
      - name: Verify news source/rights and publish exactly one three-slide carousel
        run: python3 scripts/instagram_publish_news_wates_one.py
