name: SEO pull request quality gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'build-pages.mjs'
      - 'static-source/features/Studio.tsx'
      - 'static-source/main.tsx'
      - 'static-source/render.tsx'
      - 'static-source/lib/inline-translation.mjs'
      - 'tests/bilingual-switch.test.mjs'
      - 'static-source/features/EnglishStudio.tsx'
      - 'static-source/lib/languages.mjs'
      - 'static-source/lib/inline-translation.mjs'
      - 'static-source/lib/live-content-translation.mjs'
      - 'supabase/functions/bbweb-public-translate/index.ts'
      - 'tests/dynamic-translation.test.mjs'
      - 'package.json'
      - 'tests/seo-output.test.mjs'
      - '.github/workflows/seo-pr-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BBWEB_OFFLINE_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test, build and check prerendered SEO output
        run: npm test && npm run build && npm run test:output
