name: BisaBikinWeb Instagram Calendar Recovery
# 11 Nov 18:25 WIB: strengthen recovery cadence while preserving the 17/55-minute guards, Meta quota, approved-only gate, and anti-duplicate state.

# Extra triggers help recover dropped GitHub cron events, but GitHub is best-effort.
# Respect existing Meta quota, claim state, and cooldowns; never republish claims.
on:
  schedule:
    # Every five minutes at off-peak minute marks; actual publishing retains 20-minute quote and hourly carousel cooldowns.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-calendar-recovery.yml'
  workflow_dispatch:
    inputs:
      stream:
        description: 'Approved publishing stream to recover'
        type: choice
        required: true
        default: both
        options: [both, quotes, carousels]

permissions:
  contents: write

concurrency:
  group: bisabikinweb-instagram-publish
  cancel-in-progress: false

jobs:
  recover_due:
    if: ${{ github.ref == 'refs/heads/main' && vars.IG_AUTOPUBLISH_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
      SELECT_STREAM: ${{ inputs.stream || 'both' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Determine which approved streams are overdue (read only)
        id: due
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          wib=ZoneInfo("Asia/Jakarta")
          now=dt.datetime.now(wib)
          entries=json.loads(Path("social/instagram/state.json").read_text(encoding="utf-8"))["entries"]
          quotes=json.loads(Path("social/instagram/quotes_200_queue.json").read_text(encoding="utf-8"))["items"]
          carousels=json.loads(Path("social/instagram/carousels/2026-11-10-sixty.json").read_text(encoding="utf-8"))["items"]
          if len(quotes)!=200 or len(carousels)!=60:
              raise SystemExit("SAFE_STOP: original approved 200/60 queues missing")
          def elapsed(prefix):
              dates=[]
              for key,record in entries.items():
                  if key.startswith(prefix) and isinstance(record,dict):
                      stamp=record.get("claimed_at")
                      if not isinstance(stamp,str): continue
                      try: dates.append(dt.datetime.fromisoformat(stamp))
                      except ValueError: continue
              if not dates: return float("inf")
              return (dt.datetime.now(dt.timezone.utc)-max(dates)).total_seconds()
          quote_start=dt.datetime(2026,11,10,23,35,tzinfo=wib)
          carousel_start=dt.datetime(2026,11,11,0,5,tzinfo=wib)
          due=min(200,int((now-quote_start).total_seconds()//1200)+1) if now>=quote_start else 0
          stream=os.environ.get("SELECT_STREAM","both")
          qready=(stream in ("both","quotes") and
                  any(x["id"] not in entries for x in quotes[:due]) and
                  elapsed("bbweb-quotes-200-20261111-")>=17*60)
          cready=(stream in ("both","carousels") and now>=carousel_start and
                  any(x["id"] not in entries for x in carousels) and
                  elapsed("bbweb-carousel60-20261110-")>=55*60)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"quotes={str(qready).lower()}\n")
              out.write(f"carousels={str(cready).lower()}\n")
          print(f"RECOVERY_GATE WIB={now.isoformat()} due_quotes={due} "
                f"quotes_ready={qready} carousels_ready={cready}")
          PY

      - name: Publish at most one due approved quote
        if: ${{ steps.due.outputs.quotes == 'true' }}
        run: python3 scripts/instagram_publish_200_every20.py

      - name: Install original Inter Display Bold without Ubuntu mirrors only if due
        if: ${{ steps.due.outputs.carousels == 'true' }}
        run: |
          set -euo pipefail
          # Preserve the exact Inter Display Bold family from upstream Inter v4.1.
          # Avoid Ubuntu apt mirrors, whose DNS resolution repeatedly failed on runners.
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 150 \
            'https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip' \
            --output /tmp/Inter-4.1.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/Inter-4.1.zip') as archive:
              entries = [n for n in archive.namelist() if n == 'InterDisplay-Bold.otf' or n.endswith('/InterDisplay-Bold.otf')]
              if len(entries) != 1:
                  raise SystemExit('SAFE_STOP: original Inter Display Bold OTF missing/ambiguous')
              font = archive.read(entries[0])
              if not 100_000 < len(font) < 4_000_000:
                  raise SystemExit('SAFE_STOP: unexpected font size')
              Path('/tmp/InterDisplay-Bold.otf').write_bytes(font)
          PY
          sudo mkdir -p /usr/share/fonts/opentype/inter
          sudo install -m 644 /tmp/InterDisplay-Bold.otf /usr/share/fonts/opentype/inter/InterDisplay-Bold.otf
          python3 -m pip install --disable-pip-version-check --no-cache-dir --retries 4 Pillow==12.0.0

      - name: Publish at most one due approved carousel
        if: ${{ steps.due.outputs.carousels == 'true' }}
        run: python3 scripts/instagram_carousel60_publish_one.py

      - name: Explain when no post is due
        if: ${{ steps.due.outputs.quotes != 'true' && steps.due.outputs.carousels != 'true' }}
        run: |
          echo 'NO_SAFE_ITEM_DUE: no posts eligible without bypassing anti-duplicate, quota, or cadence gates.'
