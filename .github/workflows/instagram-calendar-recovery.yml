name: BisaBikinWeb Instagram Calendar Recovery

# Backup schedule only. GitHub cron is best effort and can be delayed.
# Existing state.json claims + shared concurrency prevent duplicate publishing.
on:
  schedule:
    # 9 minutes after each 20-minute quote slot (:15/:35/:55), UTC minutes = WIB minutes.
    - cron: '4,24,44 * * * *'
    # 14 minutes after each hourly carousel slot (:05).
    - cron: '19 * * * *'
  workflow_dispatch:
    inputs:
      stream:
        description: 'Which AutoPost stream to recover'
        type: choice
        required: true
        options:
          - quotes
          - carousels

permissions:
  contents: write

concurrency:
  group: bisabikinweb-instagram-publish
  cancel-in-progress: false

jobs:
  recover_quotes:
    if: ${{ github.ref == 'refs/heads/main' && vars.IG_AUTOPUBLISH_PAUSED != 'true' && ((github.event_name == 'schedule' && github.event.schedule == '4,24,44 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.stream == 'quotes')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Recover one due quote if not already claimed, subject to Meta quota
        run: python3 scripts/instagram_publish_200_every20.py

  recover_carousel:
    if: ${{ github.ref == 'refs/heads/main' && vars.IG_AUTOPUBLISH_PAUSED != 'true' && ((github.event_name == 'schedule' && github.event.schedule == '19 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.stream == 'carousels')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install image renderer and Inter font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.0.0
      - name: Recover one overdue carousel if not claimed, subject to Meta quota
        run: python3 scripts/instagram_carousel60_publish_one.py
