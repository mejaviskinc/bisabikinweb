name: Instagram BisaBikinWeb Check Connection (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Instagram identity without publishing
        run: python3 scripts/instagram_check_connection.py
