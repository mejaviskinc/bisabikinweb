name: Instagram BisaBikinWeb 200 Quotes Every 20 Minutes
on:
  schedule:
    # Primary every 20 minutes (UTC minutes 15,35,55), with a +3-minute fallback.
    - cron: '15,35,55 * * * *'
    - cron: '18,38,58 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-200-quotes-autopost.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bisabikinweb-instagram-publish
  cancel-in-progress: false
jobs:
  publish_one:
    if: ${{ github.ref == 'refs/heads/main' && vars.IG_AUTOPUBLISH_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify 200 owned quote designs available, select only one due item, verify Meta quota and publish
        run: python3 scripts/instagram_publish_200_every20.py
      - name: Stop automatically once all 200 IDs are published or claimed
        if: ${{ always() }}
        run: echo 'ONE_ITEM_PER_TICK_ENFORCED'
