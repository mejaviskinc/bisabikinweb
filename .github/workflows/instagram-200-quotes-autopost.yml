name: Instagram BisaBikinWeb 200 Quotes Staggered AutoPost
on:
  schedule:
    - cron: '45 1 * * *'
    - cron: '57 1 * * *'
    - cron: '45 4 * * *'
    - cron: '57 4 * * *'
    - cron: '45 7 * * *'
    - cron: '57 7 * * *'
    - cron: '45 10 * * *'
    - cron: '57 10 * * *'
    - cron: '45 13 * * *'
    - cron: '57 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bisabikinweb-instagram-publish
  cancel-in-progress: false
jobs:
  publish_staggered:
    if: ${{ github.ref == 'refs/heads/main' && vars.IG_AUTOPUBLISH_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select today's approved, not-claimed single image quote
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo('Asia/Jakarta'))
          mapping={'45 1 * * *':'08:45','57 1 * * *':'08:45',
                   '45 4 * * *':'11:45','57 4 * * *':'11:45',
                   '45 7 * * *':'14:45','57 7 * * *':'14:45',
                   '45 10 * * *':'17:45','57 10 * * *':'17:45',
                   '45 13 * * *':'20:45','57 13 * * *':'20:45'}
          cron=os.environ.get('EVENT_SCHEDULE','')
          slot=mapping.get(cron)
          qpath=Path('social/instagram/quotes_200_queue.json')
          ready=False
          date=now.date().isoformat()
          if os.environ.get('EVENT_NAME') == 'schedule' and slot and qpath.exists():
              rows=json.loads(qpath.read_text(encoding='utf-8'))['items']
              entries=json.loads(Path('social/instagram/state.json').read_text(encoding='utf-8'))['entries']
              matching=[x for x in rows if x.get('date')==date and x.get('slot')==slot]
              if len(matching)>1: raise SystemExit('SAFE_STOP: two quotes in same slot')
              if len(matching)==1:
                  p=matching[0]
                  image=Path('social/instagram/rendered/quotes-200-20261111')/(p['id'][-3:]+'.jpg')
                  ready=p.get('status')=='approved' and p['id'] not in entries and image.is_file()
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as out:
              out.write('ready='+str(ready).lower()+'\n')
              out.write('date='+date+'\n')
              out.write('slot='+(slot or '')+'\n')
          print('READY' if ready else 'SKIP_NOT_DUE_OR_ALREADY_CLAIMED',date,slot)
          PY
      - name: Publish one original photo directly to Instagram via Meta
        if: ${{ github.event_name == 'schedule' && steps.select.outputs.ready == 'true' }}
        env:
          DATE: ${{ steps.select.outputs.date }}
          SLOT: ${{ steps.select.outputs.slot }}
        run: python3 scripts/instagram_autopost.py --publish --date "$DATE" --slot "$SLOT" --queue social/instagram/quotes_200_queue.json
      - name: Explain manual trigger is read-only
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo 'MANUAL_DISPATCH_DRY_RUN_ONLY; scheduled original quotes publish automatically after approval.'
