name: Instagram BisaBikinWeb 260-Post Delivery Monitor
on:
  schedule:
    - cron: '25 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-monitor-260.yml'
      - 'scripts/instagram_monitor_260.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify content queues and Meta confirmed publication IDs, alert on delays
        run: python3 scripts/instagram_monitor_260.py
