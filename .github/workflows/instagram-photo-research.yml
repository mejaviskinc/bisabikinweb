name: Inspect Official News Images - Read Only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-photo-research.yml'
      - 'scripts/instagram_find_source_images.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read official source photo metadata
        run: python3 scripts/instagram_find_source_images.py
