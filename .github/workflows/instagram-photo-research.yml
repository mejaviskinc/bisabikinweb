name: Inspect Official News Images - Read Only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/instagram-photo-research.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read official source photo metadata
        run: python3 scripts/instagram_find_source_images.py
