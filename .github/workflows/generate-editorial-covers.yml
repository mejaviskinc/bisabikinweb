name: Generate editorial photo covers

on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Starting position in the published editorial list (zero-based)"
        type: string
        required: true
        default: "0"
      limit:
        description: "Number of new photo covers to generate (paid API usage)"
        type: string
        required: true
        default: "10"
      overwrite:
        description: "Regenerate photo covers that already exist"
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/generate-editorial-covers.yml'
      - 'research/daily/*-cover-requests.json'

permissions:
  contents: write

concurrency:
  group: generate-editorial-photo-covers
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check image API secret without blocking QA
        id: check_secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Image API secret is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not configured; image generation will be skipped without making API calls."
          fi
      - name: Generate draft-specific covers from request file
        if: github.event_name == 'push' && steps.check_secret.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          REQUEST_FILE="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '^research/daily/[0-9]{4}-[0-9]{2}-[0-9]{2}-cover-requests\.json$' | head -n 1 || true)"
          if [ -z "$REQUEST_FILE" ]; then
            echo "No dated editorial cover request file changed; image generation skipped."
            exit 0
          fi
          node scripts/generate-editorial-covers.mjs --draft-requests "$REQUEST_FILE" --overwrite
      - name: Generate published article covers from manual selection
        if: github.event_name == 'workflow_dispatch' && steps.check_secret.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.overwrite }}" = "true" ]; then EXTRA="--overwrite"; fi
          node scripts/generate-editorial-covers.mjs --offset "${{ inputs.offset }}" --limit "${{ inputs.limit }}" $EXTRA
      - name: Normalize changed covers to 16:9 WebP
        if: steps.check_secret.outputs.available == 'true'
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import subprocess

          changed = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          for line in changed:
              rel = line[3:].strip().strip('"')
              path = Path(rel)
              if path.parts[:2] != ("public-assets", "editorial-covers"):
                  continue
              if path.suffix.lower() != ".webp" or not path.exists():
                  continue
              with Image.open(path) as source:
                  image = source.convert("RGB")
              width, height = image.size
              target_height = round(width * 9 / 16)
              if height > target_height:
                  top = (height - target_height) // 2
                  image = image.crop((0, top, width, top + target_height))
              elif height < target_height:
                  target_width = round(height * 16 / 9)
                  left = (width - target_width) // 2
                  image = image.crop((left, 0, left + target_width, height))
              image.save(path, "WEBP", quality=82, method=6)
              print(f"Normalized {path}: {image.width}x{image.height}")
          PY
      - name: Check editorial tests and production build
        run: |
          npm ci
          npm test
          npm run build
          npm run test:output
      - name: Commit generated images
        if: steps.check_secret.outputs.available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-assets/editorial-covers static-source/lib/editorial-cover-map.mjs
          if git diff --cached --quiet; then
            echo "No new images"
            exit 0
          fi
          git commit -m "media: refresh photorealistic editorial photo covers"
          git push
