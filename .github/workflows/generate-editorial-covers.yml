name: Generate editorial photo covers

on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Starting position in the published editorial list (zero-based)"
        type: string
        required: true
        default: "0"
      limit:
        description: "Number of new photo covers to generate (paid API usage)"
        type: string
        required: true
        default: "10"
      overwrite:
        description: "Regenerate photo covers that already exist"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate-editorial-photo-covers
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check secret before spending credits
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing OPENAI_API_KEY repository secret. No generated images or charges."
            exit 1
          fi
      - name: Generate original headline-matched covers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.overwrite }}" = "true" ]; then EXTRA="--overwrite"; fi
          node scripts/generate-editorial-covers.mjs --offset "${{ inputs.offset }}" --limit "${{ inputs.limit }}" $EXTRA
      - name: Check editorial tests
        run: |
          npm ci
          npm test
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-assets/editorial-covers static-source/lib/editorial-cover-map.mjs
          if git diff --cached --quiet; then
            echo "No new images"
            exit 0
          fi
          git commit -m "media: refresh photorealistic editorial photo covers"
          git push
