name: Instagram BisaBikinWeb 60 Carousels Hourly
on:
  schedule:
    # Hourly carousel, with one recovery check five minutes later.
    - cron: '5 * * * *'
    - cron: '10 * * * *'
  push:
    branches: [main]
    paths:
      - 'social/instagram/carousels/commands/publish-first-now-20261110.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bisabikinweb-instagram-publish
  cancel-in-progress: false
jobs:
  publish_one_carousel:
    if: ${{ github.ref == 'refs/heads/main' && vars.IG_AUTOPUBLISH_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install image renderer and Inter font
        run: |
          # GitHub runners occasionally hit temporary Ubuntu mirror DNS failures.
          # Retry dependency setup without weakening publishing/approval safeguards.
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'DEPENDENCY_SETUP_FAILED_AFTER_3_ATTEMPTS'
              exit 1
            fi
            sleep 20
          done
          python3 -m pip install --disable-pip-version-check --no-cache-dir --retries 4 Pillow==12.0.0
      - name: Publish exactly one unclaimed original carousel with Meta quota guard
        run: python3 scripts/instagram_carousel60_publish_one.py
