name: Instagram BisaBikinWeb 60 Carousels Hourly
on:
  schedule:
    # Hourly carousel, with one recovery check five minutes later.
    - cron: '5 * * * *'
    - cron: '10 * * * *'
  push:
    branches: [main]
    paths:
      - 'social/instagram/carousels/commands/publish-first-now-20261110.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bisabikinweb-instagram-publish
  cancel-in-progress: false
jobs:
  publish_one_carousel:
    if: ${{ github.ref == 'refs/heads/main' && vars.IG_AUTOPUBLISH_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install original Inter Display Bold from upstream GitHub release and Pillow
        run: |
          set -euo pipefail
          # Preserve the exact Inter Display Bold family from upstream Inter v4.1.
          # Avoid Ubuntu apt mirrors, whose DNS resolution repeatedly failed on runners.
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 150 \
            'https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip' \
            --output /tmp/Inter-4.1.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/Inter-4.1.zip') as archive:
              entries = [n for n in archive.namelist() if n == 'InterDisplay-Bold.otf' or n.endswith('/InterDisplay-Bold.otf')]
              if len(entries) != 1:
                  raise SystemExit('SAFE_STOP: original Inter Display Bold OTF missing/ambiguous')
              font = archive.read(entries[0])
              if not 100_000 < len(font) < 4_000_000:
                  raise SystemExit('SAFE_STOP: unexpected font size')
              Path('/tmp/InterDisplay-Bold.otf').write_bytes(font)
          PY
          sudo mkdir -p /usr/share/fonts/opentype/inter
          sudo install -m 644 /tmp/InterDisplay-Bold.otf /usr/share/fonts/opentype/inter/InterDisplay-Bold.otf
          python3 -m pip install --disable-pip-version-check --no-cache-dir --retries 4 Pillow==12.0.0
      - name: Publish exactly one unclaimed original carousel with Meta quota guard
        run: python3 scripts/instagram_carousel60_publish_one.py
