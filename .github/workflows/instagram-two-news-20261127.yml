name: Instagram Two News Carousels 2026-11-27
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-two-news-20261127.yml'
permissions:
  contents: write
concurrency:
  group: bisabikinweb-instagram-publish
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && vars.IG_AUTOPUBLISH_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IG_AUTOPUBLISH_ENABLED: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE || 'https://graph.facebook.com' }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.0.0
      - run: python3 scripts/instagram_publish_two_news_20261127.py
